<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - ERIC COLLECTION</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- BANNIÈRE EN-TÊTE DE LA BOUTIQUE -->
    <section class="shop-banner">
        <h1>Tous nos produits</h1>
        <p>Explorez notre collection complète et trouvez votre style</p>
    </section>

    <!-- CONTENEUR PRINCIPAL DE LA BOUTIQUE -->
    <main class="shop-container">
        
        <!-- BARRE LATÉRALE DE FILTRES -->
        <aside class="shop-sidebar">
            
            <div class="filter-group">
                <h3>Catégories</h3>
                <ul class="filter-list">
                    <li><a href="#" class="active">Tous</a></li>
                    <li><a href="#">Vestes</a></li>
                    <li><a href="#">T-Shirts</a></li>
                    <li><a href="#">Pantalons</a></li>
                    <li><a href="#">Manteaux</a></li>
                    <li><a href="#">Accessoires</a></li>
                </ul>
            </div>

            <div class="filter-group">
                <h3>Trier par</h3>
                <select class="sort-select">
                    <option value="popular">Nouveautés & Populaire</option>
                    <option value="price-asc">Prix : Croissant</option>
                    <option value="price-desc">Prix : Décroissant</option>
                </select>
            </div>

        </aside>

        <!-- ZONE D'AFFICHAGE DES PRODUITS -->
        <section class="shop-products-grid" id="shop-products">
            <!-- Nous ajouterons les cartes de produits ici à l'étape suivante -->
        </section>

    </main>

    <!-- Fichier JavaScript (à conserver pour plus tard) -->
    <script src="script.js"></script>
</body>
</html>
